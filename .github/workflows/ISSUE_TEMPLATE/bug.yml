name: "🐛 Signaler un bug"
description: "Signaler un problème rencontré dans Un pas après l'autre."
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Les tickets sont publics. Masque les informations personnelles dans ton texte et tes captures."
  - type: textarea
    id: probleme
    attributes:
      label: "Quel problème as-tu rencontré ?"
      description: "Indique ce qui s'est passé et ce que tu attendais."
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: "Comment reproduire le problème ?"
      description: "Indique la page utilisée et les actions effectuées avant le problème."
  - type: input
    id: environnement
    attributes:
      label: "Sur quel appareil et navigateur ?"
      placeholder: "Ex. téléphone Android, Chrome, application installée"
  - type: textarea
    id: captures
    attributes:
      label: "Capture ou message d'erreur"
      description: "Ajoute une capture ou copie le message d'erreur si tu en as un."
