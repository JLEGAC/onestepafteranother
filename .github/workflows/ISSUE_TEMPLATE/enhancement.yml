name: "💡 Proposer une amélioration"
description: "Suggérer une amélioration pour Un pas après l'autre."
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: "Les tickets sont publics. Masque les informations personnelles dans ton texte et tes captures."
  - type: textarea
    id: besoin
    attributes:
      label: "Quel besoin veux-tu couvrir ?"
      description: "Décris ce que tu cherches à faire ou ce qui te bloque aujourd'hui."
    validations:
      required: true
  - type: textarea
    id: proposition
    attributes:
      label: "Qu'aimerais-tu voir dans l'application ?"
      description: "Décris l'amélioration et indique sur quelle page elle serait utile, si tu le sais."
    validations:
      required: true
  - type: textarea
    id: exemple
    attributes:
      label: "Exemple ou capture"
      description: "Ajoute un exemple d'usage ou une capture si cela aide à comprendre ton idée."
