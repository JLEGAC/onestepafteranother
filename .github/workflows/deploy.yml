name: Déployer la PWA sur GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Récupérer les fichiers du dépôt
        uses: actions/checkout@v7

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v6

      - name: Vérifier la PWA
        run: npm run check && npm test

      - name: Produire les captures et préparer le site
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
          python3 -m http.server 8765 > /tmp/pasapas-http.log 2>&1 &
          curl --fail --silent --retry 10 --retry-delay 1 --retry-connrefused http://127.0.0.1:8765/ > /dev/null
          node scripts/screenshots.cjs
          mkdir -p _site
          cp index.html styles.css manifest.json sw.js *.svg *.png _site/
          cp -r src screenshots _site/

      - name: Préparer les fichiers statiques
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Publier le site
        id: deployment
        uses: actions/deploy-pages@v5
